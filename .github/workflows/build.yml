name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        shell: pwsh
        run: ./release.ps1
        env:
          CI: "true"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamKoreanKeyboard
          path: SteamKoreanKeyboard-*.zip
          if-no-files-found: error
